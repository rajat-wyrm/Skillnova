name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main, feat/**, fix/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-lint:
    name: Server lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint

  server-test:
    name: Server test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The server test-suite uses Node's built-in test runner against a real
    # PostgreSQL database (e.g. settings & notifications tests write/read live
    # rows, and notifications.test.js asserts an INTERN user exists — created by
    # `npm run seed`). The Prisma client must also be generated before the tests
    # import `@prisma/client`, otherwise they throw "did not initialize yet".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillnova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillnova?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/5432) 2>/dev/null; then echo "PostgreSQL ready"; break; fi
            echo "Waiting for PostgreSQL..."; sleep 1
          done
      - run: npm run prisma:generate
      - run: npm run prisma:push
      - run: npm run seed
      - run: npm test

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    env:
      VITE_APP_NAME: SkillNova
      VITE_APP_URL: http://localhost:5273
      VITE_API_URL: http://localhost:4000/api/v1
      VITE_SOCKET_URL: http://localhost:4000
      VITE_AIASSISTANT_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  full-check:
    name: All checks
    needs: [server-lint, server-test, frontend-lint, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [ "${{ needs.server-lint.result }}" != "success" ] || \
             [ "${{ needs.server-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-lint.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed."